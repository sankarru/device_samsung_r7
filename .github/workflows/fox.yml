name: OrangeFox Build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free space + deps
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y git python3 ccache curl gperf
          mkdir -p ~/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: OrangeFox sync 12.1
        run: |
          mkdir -p ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git ~/OrangeFox_sync/sync
          cd ~/OrangeFox_sync/sync
          ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1
          ls ~/fox_12.1/device 2>&1 | head -n 20
      - name: Add device tree
        run: |
          set -x
          ls ~/fox_12.1/device/samsung 2>&1 | head
          git clone https://github.com/sankarru/device_samsung_r7 -b twrp-12.1 ~/fox_12.1/device/samsung/r7
          ls ~/fox_12.1/device/samsung/r7 2>&1 | head -n 20
          cat ~/fox_12.1/device/samsung/r7/AndroidProducts.mk 2>&1 | head
          sed -i 's|vendor/twrp/config/common.mk|vendor/fox/config/common.mk|' ~/fox_12.1/device/samsung/r7/twrp_r7.mk || true
          grep -n "fox\|twrp" ~/fox_12.1/device/samsung/r7/twrp_r7.mk | head
          echo 'FOX_BUILD_DEVICE := r7' >> ~/fox_12.1/device/samsung/r7/BoardConfig.mk
          echo 'OF_MAINTAINER := sankarru' >> ~/fox_12.1/device/samsung/r7/BoardConfig.mk
      - name: Build
        run: |
          set +e
          cd ~/fox_12.1
          ls device/samsung/r7/AndroidProducts.mk 2>&1 | head
          cat device/samsung/r7/AndroidProducts.mk 2>&1 | head
          source build/envsetup.sh
          echo "--- lunch ---"
          lunch twrp_r7-eng 2>&1 | cat
          echo "lunch exit:$?"
          echo "--- mka ---"
          mka -j4 recoveryimage 2>&1 | tee /tmp/build.log | tail -n 300
          echo "mka exit:$?"
          ls -lh out/target/product/r7/*.img 2>&1 | head -n 20
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-r7
          path: ~/fox_12.1/out/target/product/r7/*.img
